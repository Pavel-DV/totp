<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TOTP</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      margin: 2rem;
      background-color: black;
      color: white;
    }

    header {
      margin-bottom: 1rem;
    }

    main {
      max-width: 720px;
    }
  </style>
</head>

<body>
  <progress id="remainingSeconds" max="30" value="30"></progress>
  <label for="remainingSeconds" style="margin-left:8px"></label>
  <main id="codes"></main>
  <script type="module">
    import { unwrapKey } from './webauthn.js';
    import { decrypt } from './decrypt.js';
    import { dec } from './helpers.js';
    import { generateTotpCode } from './totp.js';

    const state = {
      timeStep: 0,
    }

    const updateCodes = async (secrets, timeStep) => {
      const codesContainer = document.getElementById('codes')
      codesContainer.innerHTML = ''

      const tokenElementsPromises = secrets.map(async secret => {
        const tokenElement = document.createElement('div')
        tokenElement.innerHTML = `${secret.issuer} : ${secret.login}`

        const codeElement = document.createElement('span')
        tokenElement.appendChild(codeElement)
        const code = await generateTotpCode(secret.secret, timeStep)
        const formattedCode = code.match(/.{1,3}/g).join('<span style="margin: 0 2px"></span>')
        codeElement.innerHTML = formattedCode
        codeElement.style.color = '#999'

        Object.assign(codeElement.style, {
          color: '#999',
          fontSize: '1.5rem',
          padding: '1rem',
          cursor: 'pointer',
        })

        codeElement.onclick = () => {
          navigator.clipboard.writeText(code)
          const notification = document.createElement('span')
          notification.textContent = '📋'
          notification.style.position = 'absolute'
          notification.style.top = '5px'
          codeElement.appendChild(notification)

          setTimeout(() => {
            codeElement.removeChild(notification)
          }, 500)
        }

        const urlElement = document.createElement('a')
        tokenElement.appendChild(urlElement)
        urlElement.textContent = 'Add to Auth app 🔗'

        const url = new URL('otpauth://totp')
        url.pathname = `${secret.issuer}:${secret.login}`

        const params = [
          { name: 'issuer', value: secret.issuer },
          { name: 'secret', value: secret.secret },
          { name: 'password', value: secret.password },
          { name: 'website', value: secret.website },
          { name: 'notes', value: secret.notes },
          { name: 'salt', value: secret.salt },
          { name: 'algorithm', value: 'SHA1' },
          { name: 'digits', value: '6' },
          { name: 'period', value: '30' },
        ]

        const nonEmptyParams = params.filter(p => p.value && p.value !== '')
        nonEmptyParams.forEach(p => url.searchParams.set(p.name, p.value))
        urlElement.href = url.href

        Object.assign(tokenElement.style, {
          position: 'relative',
          backgroundColor: '#222',
          padding: '1rem',
          marginBottom: '1rem',
          borderRadius: '5px',
        })

        return tokenElement
      })

      const tokenElements = await Promise.all(tokenElementsPromises)

      codesContainer.append(...tokenElements)
    }

    const refreshCounter = (secrets) => {
      const remainingSecondsElement = document.getElementById('remainingSeconds')

      setInterval(() => {
        const timeStep = Math.floor(Date.now() / 1000 / 30)

        if (timeStep !== state.timeStep) {
          state.timeStep = timeStep
          updateCodes(secrets, timeStep)
        }

        const remainingSeconds = 30 - Math.floor(Date.now() / 1000) % 30
        const remainingLabel = document.querySelector('label[for="remainingSeconds"]')
        remainingLabel.textContent = `${remainingSeconds}`
        remainingSecondsElement.value = 30 - remainingSeconds
      }, 1000)
    }


    (async () => {
      const { default: encriptedSecrets } = await import('./secrets.json', { with: { type: "json" } })

      const encPassword = dec(await unwrapKey())
      const salt = encriptedSecrets.salt

      const secrets = encriptedSecrets.credentials.map(async (s) => {
        const issuer = await decrypt(encPassword, { salt, ...s.issuer });
        const secret = await decrypt(encPassword, { salt, ...s.secret });
        const login = await decrypt(encPassword, { salt, ...s.login });
        const password = await decrypt(encPassword, { salt, ...s.password });
        const website = await decrypt(encPassword, { salt, ...s.website });
        const notes = await decrypt(encPassword, { salt, ...s.notes });

        return {
          issuer,
          login,
          secret,
          password,
          website,
          notes,
          salt,
        };
      });

      const resolvedSecrets = await Promise.all(secrets);
      refreshCounter(resolvedSecrets)
    })()
  </script>
</body>

</html>
