<textarea id="input" rows="12" cols="50">

</textarea>

<textarea id="output" rows="12" cols="50">{

}
</textarea>

<button id="encrypt">Encrypt</button>

<script type="module">
    import { b64, unb64 } from './helpers.js';
    import { unwrapKey } from './webauthn.js';
    import { dec } from './helpers.js';

    const encryptButton = document.getElementById('encrypt')
    const encriptionPassword = dec(await unwrapKey())
    const { default: encriptedSecrets } = await import('./secrets.json', { with: { type: "json" } })
    const salt = encriptedSecrets.salt

    const inputData = {
        encriptionPassword,
        salt,
        plaintext: 'ggg',
        iv: ''
    }

    input.value = JSON.stringify(inputData, null, 2)

    const getCleanIv = () => {
        const emptyArr = new Uint8Array(12)
        while (true) {
            const iv = crypto.getRandomValues(emptyArr)
            const strIv = b64(iv)

            if (!/[^\w]/.test(strIv)) {
                return iv
            }
        }
    }

    const cleanEncode = async ({ plaintext, password, salt, iv }) => {
        if (iv !== '') {
            return { iv, ciphertext: await encode({ plaintext, password, salt, iv: unb64(iv) }) }
        }

        while (true) {
            const iv = getCleanIv()
            const ciphertext = await encode({ plaintext, password, salt, iv })
            const strCiphertext = b64(new Uint8Array(ciphertext))

            if (!/[^\w]/.test(strCiphertext)) {
                return { iv, ciphertext }
            }
        }
    }

    encryptButton.addEventListener('click', async () => {
        const input = document.getElementById('input')
        const output = document.getElementById('output')

        const inputData = JSON.parse(input.value)
        const encriptionPassword = inputData.encriptionPassword

        const salt = inputData.salt === '' ? crypto.getRandomValues(new Uint8Array(16)) : unb64(inputData.salt)

        const { iv, ciphertext } = await cleanEncode({ plaintext: inputData.plaintext, password: encriptionPassword, salt, iv: inputData.iv })

        const json = {
            issuer: inputData.issuer,
            salt: b64(salt),
            iv: b64(iv),
            ciphertext: b64(new Uint8Array(ciphertext)),
        }

        output.value = JSON.stringify(json, null, 2)
    })

    const encode = async ({ plaintext, password, salt, iv }) => {
        if (!plaintext) {
            return ''
        }

        const enc = s => new TextEncoder().encode(s)

        const baseKey = await crypto.subtle.importKey(
            'raw',
            enc(password),
            'PBKDF2',
            false,
            ['deriveKey']
        )

        const key = await crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
            baseKey,
            { name: 'AES-GCM', length: 256 },
            false,
            ['encrypt']
        )

        const ciphertext = await crypto.subtle.encrypt(
            { name: 'AES-GCM', iv },
            key,
            enc(plaintext)
        )

        const json = {
            salt: b64(salt),
            iv: b64(iv),
            ciphertext: b64(new Uint8Array(ciphertext)),
        }

        console.log(JSON.stringify(json))

        return ciphertext
    }
</script>
